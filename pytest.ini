[pytest]
testpaths = tests
# The repository root IS the Hermes plugin: it contains __init__.py and
# adapter.py, which Hermes imports as the plugin package. That makes the repo
# root a "package ancestor" of tests/, and pytest's default collection walks up
# to it, tries to import the plugin __init__.py as the tests' package init, and
# fails with "attempted relative import with no known parent package" (the
# plugin's relative imports have no parent package at that point).
#
# --confcutdir anchors collection at tests/, so pytest never walks up into the
# plugin package. It must be passed via addopts because confcutdir is a
# command-line option, not an ini key. tests/conftest.py then puts the repo root
# on sys.path for the flat helper module (hermes_xmpp_plugin_common).
addopts = --confcutdir=tests
